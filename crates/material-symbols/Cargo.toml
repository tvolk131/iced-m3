[package]
name = "iced-m3-material-symbols"
version = "0.1.0-beta.6"
edition = "2024"
rust-version = "1.88"
description = "Official offline Material Symbols asset bundle for iced-m3"
license = "MIT AND Apache-2.0"
readme = "README.md"
repository = "https://github.com/tvolk131/iced-m3"
publish = ["crates-io"]
include = ["/LICENSE-MIT", "/Cargo.toml", "/README.md", "/build.rs", "/codegen.rs", "/src/**", "/assets/**"]

[build-dependencies]
serde_json = "1.0.145"

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
iced_core = { version = "0.14.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
