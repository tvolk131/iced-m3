name: CI
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ICED_TEST_BACKEND: tiny-skia
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Check development tooling
        run: |
          cargo fmt --manifest-path xtask/Cargo.toml -- --check
          cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path xtask/Cargo.toml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: cargo build --locked --examples
      - run: cargo test --locked --all-targets --no-default-features
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Check the docs.rs target and feature configuration
        if: runner.os == 'Linux'
        run: cargo doc --locked --no-deps --no-default-features --target x86_64-unknown-linux-gnu
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Check the independent desktop consumer
        run: |
          cargo fmt --manifest-path consumers/desktop/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path consumers/desktop/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path consumers/desktop/Cargo.toml --all-targets
          cargo test --locked --manifest-path consumers/desktop/Cargo.toml --all-targets --no-default-features
      - name: Verify the archive and consume its extracted contents
        if: runner.os == 'Linux'
        run: cargo xtask check-package
      - name: Verify publication without uploading
        if: runner.os == 'Linux'
        run: cargo publish --dry-run --locked

  msrv:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Check the library and standalone app on minimum Rust
        run: |
          cargo check --locked --manifest-path xtask/Cargo.toml --all-targets
          cargo check --locked --all-targets
          cargo check --locked --all-targets --no-default-features
          cargo check --locked --manifest-path consumers/desktop/Cargo.toml --all-targets
          cargo check --locked --manifest-path consumers/desktop/Cargo.toml --all-targets --no-default-features

  visual:
    # Canonical reference environment: Apple Silicon, bundled Roboto, Tiny Skia,
    # fixed 2x scale and compiler. Other platforms keep the behavioral tests above.
    runs-on: macos-26
    env:
      ICED_TEST_BACKEND: tiny-skia
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Compare component animation and gallery references
        run: cargo test --locked --no-default-features --all-targets visual_references -- --ignored
      - name: Build visual review report
        if: always()
        run: python3 tests/visual/report.py
      - name: Upload reference comparisons and frame viewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-visual-report
          path: target/visual-report/
          if-no-files-found: error
          retention-days: 14

  doc-media:
    # A single pinned renderer produces both PR previews and the candidate archive.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Test stale, missing, orphan, and corrupt media rejection
        run: cargo test --locked --manifest-path xtask/Cargo.toml
      - name: Render twice, verify rustdoc and the extracted package, dry-run publication
        run: cargo xtask doc-media check
      - name: Consume the prepared archive from an independent app
        run: cargo xtask check-package --source target/doc-media/stage --require-doc-media
      - name: Upload illustrated API reference
        uses: actions/upload-artifact@v4
        with:
          name: component-documentation
          path: target/doc/
          if-no-files-found: error
          retention-days: 14
      - name: Upload validated archive and media manifest
        uses: actions/upload-artifact@v4
        with:
          name: component-doc-package
          path: |
            target/package/*.crate
            target/doc-media/release.json
          if-no-files-found: error
          retention-days: 14

  packaged-docs-linux:
    needs: doc-media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: actions/download-artifact@v4
        with:
          name: component-doc-package
          path: target/downloaded-doc-package
      - name: Verify packaged previews on the docs.rs platform
        run: cargo xtask doc-media check-archive --archive target/downloaded-doc-package/package/*.crate
